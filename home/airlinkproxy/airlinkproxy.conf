# AirLinkProxy configuration file
# This configuration is good for testing.
# It writes to a database in /tmp
# and prints debug info to stdout.

debug                 = 1
log-to-stdout         = 1
service-name          = airlink-proxy
hostname              = airlink
port                  = 80
timeout-secs          = 1
server-port           = 8040
poll-freq-secs        = 5
# Shifts each poll this many seconds later within its poll window.  If more
# than one proxy is running, set a non-zero offset on the second so there are
# not simultaneous requests.  Must be less than poll-freq-secs.
poll-freq-offset      = 0
archive-interval-secs = 300
database-file         = /tmp/airlinkproxy.sdb
